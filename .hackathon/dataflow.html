# Повний датафлоу: Юрко, Завуч, Оля (PawChamp, підписки)

Сім діаграм від загальної до детальних. Таблиці внизу — довідник для коду: інтенти, тули, вебхуки, події журналу.
Правила взяті з публічної політики PawChamp (research/6-pawchamp.md). Те, що ми вигадали для демо, позначено *(демо)*.

## 2. Як Юрко класифікує і куди направляє

швидка модель OpenAI повертає JSON, який валідує Pydantic: `intent`, `platform`, `region`, `chargeback_threat`, `injection_suspected`, `wants_human`, `sentiment`. Ідентифікацію, prompt injection і бажання говорити з людиною перевіряємо **до** розбору інтенту.

  RETRY -->|"знову збій"| HUM["Агент-людина"]

## 5. Життя однієї дії: тул → хуки → вебхук → квитанція

```mermaid
sequenceDiagram
  autonumber
  participant Y as Юрко
  participant Z as Завуч
  participant X as Виконавець (код)
  participant B as Білінг
  participant L as Журнал
  Y->>Z: refund_payment(pay_9001, €38.99, "§6.5.1")
  Note over Z: Хук 1: мета = дія? правило? сума? injection?
  alt BLOCK або ESCALATE
    Z-->>Y: вердикт + причина
    Z->>L: hook1.verdict
  else PASS
    Z->>X: дозвіл
    X->>L: action.submitted (ключ ідемпотентності)
    X->>B: POST /refunds  Idempotency-Key: T-1042-refund-pay_9001
    B-->>X: 200 status=processing
    X->>L: receipt pending
    alt вебхук refund.succeeded
      B->>X: webhook refund.succeeded
      X->>B: GET /refunds/re_1 (read-back)
      Note over Z: Хук 2: вебхук + read-back збігаються
      X->>L: receipt confirmed
    else вебхук refund.failed
      B->>X: webhook refund.failed
      X->>L: receipt failed → алерт Олі + тікет людині
    else таймаут, Юрко повторює
      X->>B: POST /refunds  той самий ключ
      B-->>X: той самий refund re_1 (не новий)
    end
    X-->>Y: квитанція
  end
```

Стани квитанції:

```mermaid
stateDiagram-v2
  direction LR
  [*] --> proposed: Юрко викликав тул

  proposed --> awaiting_human: хук 1 ESCALATE
  awaiting_human --> submitted: людина апрувнула
  awaiting_human --> blocked: людина відмовила
  proposed --> submitted: хук 1 PASS
  submitted --> pending: білінг прийняв
  pending --> confirmed: вебхук + read-back
  pending --> failed: refund.failed

## Збої техніки
| Що сталося | Що робимо |
|---|---|
| LLM повернула невалідний JSON | Pydantic відхиляє, повтор до 2 разів, потім людина |
| LLM 500/503 або вичерпано ліміт запитів | повтор з паузою; якщо не вийшло, людина. Навмання не відповідаємо |
| Вебхук запізнюється | квитанція `pending`, відповідь «обробляється», follow-up |
| Вебхук прийшов двічі або не по порядку | обробляємо за `event_id` один раз; стан беремо з read-back |
| Таймаут на дії | повтор з тим самим ключем ідемпотентності, дубля немає |
| Юрко дає ту саму пораду вдруге | ескалація людині |

## Довідник

### Інтенти (вихід класифікації)
| intent | Приклад | Куди |
|---|---|---|
| `how_to` | «Як скасувати?», «Що входить?» | А |
| `access` | «Не можу увійти» | А (інструкція; скидання пароля робить людина) |
| `cancel` | «Скасуйте підписку» | Б |
| `refund` | «Поверніть гроші» | В |
| `unrecognized_charge` | «Що за списання PawChamp?» | Г |
| `double_charge` | «Списали двічі» | Д |
| `other` / `complaint` | усе інше | людина |

Прапорці: `platform` (web / app_store / google_play / unknown), `region` (EU / US / other), `chargeback_threat`, `injection_suspected`, `wants_human`, `sentiment`.

### Тули Юрка
| Тул | Тип | Що робить | Хук 1? |
|---|---|---|---|
| `find_customer(email)` | читання | клієнт, країна, платформа | — |
| `get_subscription(customer_id)` | читання | план, статус, наступне списання, додатки | — |
| `get_payments(customer_id)` | читання | платежі й рефанди | — |
| `search_help(query)` | читання | пошук по статтях help center (BM25) | — |
| `cancel_subscription(subscription_id)` | **дія** | скасувати автопродовження | так |
| `refund_payment(payment_id, amount, clause)` | **дія** | рефанд з цитатою пункту | так |
| `escalate_to_human(reason)` | дія | тікет людині з контекстом | — |
| `schedule_followup(receipt_id)` | дія | дописати клієнту, коли прийде вебхук | — |

### Вебхуки білінгу (`POST /webhooks/billing`)
| Подія | Що підтверджує | Квитанція |
|---|---|---|
| `subscription.canceled` | скасування | confirmed |
| `refund.created` | рефанд прийнято | pending |
| `refund.succeeded` | рефанд пройшов | confirmed |
| `refund.failed` | рефанд не пройшов | failed → алерт |
| `dispute.created` | клієнт пішов у банк (chargeback) | алерт Олі, тікет людині |

Кожен вебхук перевіряється за підписом, обробляється один раз за `event_id`, а потім звіряється з read-back (`GET` до білінгу).

### Вердикти Завуча
| Вердикт | Людською мовою |
|---|---|
| `PASS` | все правильно, далі |
| `FIX` | суть ок, текст неправдивий, переписати |
| `BLOCK` | заборонено правилами, пояснити клієнту |
| `ESCALATE` | вирішує людина |
